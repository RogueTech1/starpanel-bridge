[platformio]
default_envs = mega-panel
[env]
platform = atmelavr@5.1.0
framework = arduino
build_src_filter = +<configured.cpp>
extra_scripts = pre:patch_vendor.py
lib_deps =
  https://github.com/DCSBIOSKit/dcs-bios-arduino-library.git#fa7f4dddabd20322cc1309ca0021eb0dd5428313
  olikraus/U8g2@2.36.18
[env:dcsbioskit-master]
board = megaatmega2560
build_src_filter = +<master.cpp>
lib_deps = https://github.com/DCSBIOSKit/dcs-bios-arduino-library.git#fa7f4dddabd20322cc1309ca0021eb0dd5428313
[env:mega-panel]
board = megaatmega2560
build_src_filter = +<configured.cpp>
build_flags = -D SC_RS485=1
[env:nano-panel]
board = nanoatmega328new
build_src_filter = +<configured.cpp>
build_flags = -D SC_RS485=1
[env:mega-standalone]
board = megaatmega2560
build_src_filter = +<configured.cpp>
[env:nano-standalone]
board = nanoatmega328new
build_src_filter = +<configured.cpp>
[env:uno-standalone]
board = uno
build_src_filter = +<configured.cpp>

[env:leonardo-standalone]
board = leonardo
build_src_filter = +<configured.cpp>
[env:micro-standalone]
board = micro
build_src_filter = +<configured.cpp>
[env:promicro-standalone]
board = sparkfun_promicro16
build_src_filter = +<configured.cpp>
