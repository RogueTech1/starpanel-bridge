[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.12.0
framework = arduino
extra_scripts = pre:portable_paths.py
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  adafruit/Adafruit SSD1306@2.5.15
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit NeoPixel@1.15.2

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1

[env:esp32]
board = esp32dev

[env:esp32s3-wifi]
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D SC_NETWORK=1

[env:esp32-wifi]
board = esp32dev
build_flags = -D SC_NETWORK=1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c3-wifi]
board = esp32-c3-devkitm-1
build_flags = -D SC_NETWORK=1

[env:esp32c3supermini]
board = esp32-c3-devkitm-1
build_flags = -D SC_NETWORK=1 -D SC_SUPERMINI=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1

[env:esp32s2mini]
board = lolin_s2_mini
build_flags = -D SC_NETWORK=1 -D SC_S2MINI=1 -D ARDUINO_USB_CDC_ON_BOOT=1
