name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/audit-public.mjs --history
      - run: npm audit
      - shell: powershell
        run: ./scripts/scan-secrets.ps1
