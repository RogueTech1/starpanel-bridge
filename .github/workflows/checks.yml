name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-doc-links.mjs
      - run: node scripts/validate-design.mjs examples/supermini-gear.starpanel.json
      - run: npm audit --omit=dev
      - shell: powershell
        run: ./scripts/build-native.ps1
