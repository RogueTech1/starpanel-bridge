name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm test
      - run: uv run --with platformio --with esptool==4.9.0 pio run -d firmware -e esp32s3 -e esp32 -e esp32c3 -e esp32s3-wifi -e esp32-wifi -e esp32c3-wifi -e esp32c3supermini -e esp32s2mini
      - run: uv run --with platformio pio run -d firmware-dcsbios -e mega-panel -e nano-panel -e mega-standalone -e nano-standalone -e uno-standalone -e leonardo-standalone -e micro-standalone -e promicro-standalone
      - run: uv run --with platformio pio pkg install --global --tool 'platformio/tool-avrdude@~1.60300.0'
      - run: npm run firmware:package
      - shell: powershell
        run: ./scripts/build-native.ps1
      - run: node scripts/collect-licenses.mjs
      - run: npm run dist
      - shell: powershell
        run: Get-FileHash dist/StarPanel-Bridge-Setup-*.exe -Algorithm SHA256 | Format-List | Out-File dist/installer-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StarPanel-Bridge-Windows
          path: |
            dist/StarPanel-Bridge-Setup-*.exe
            dist/installer-sha256.txt
