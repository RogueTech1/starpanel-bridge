appId: net.nidavard.starcitizen-hardware-bridge
productName: StarPanel Bridge
directories:
  output: dist
asar: true
npmRebuild: false
files:
  - desktop/**/*
  - src/**/*
  - panel.json
  - package.json
  - '!**/node_modules/**/README*'
  - '!**/node_modules/**/CHANGELOG*'
  - '!**/node_modules/**/HISTORY*'
  - '!**/node_modules/**/test{,s}/**'
  - '!**/node_modules/**/examples/**'
extraResources:
  - from: schema/live/sc_extrait.desc
    to: schema/telemetry.desc
  - from: schema/local.desc
    to: schema/ptu.desc
  - from: schema/live/field-catalog.json
    to: schema/field-catalog.json
  - from: firmware-images
    to: firmware-images
  - from: tools/avrdude
    to: tools/avrdude
  - from: docs
    to: docs
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: LICENSE
  - from: licenses
    to: licenses
  - from: skills
    to: skills
  - from: examples
    to: examples
  - from: data
    to: data
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/assets/icon.ico
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  artifactName: StarPanel-Bridge-Setup-${version}.${ext}
